[package]
name = "whitelist_tokenizer_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "whitelist_tokenizer_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wl_tok"
path = "src/bin/main.rs"

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
once_cell = "1"
anyhow = "1"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

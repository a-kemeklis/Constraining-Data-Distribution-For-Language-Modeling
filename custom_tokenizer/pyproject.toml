[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "whitelist_tokenizer_rs"
requires-python = ">=3.9"
version = "0.1.0"
description = "WhitelistTokenizer — fast Rust tokenizer for PyTorch training"

[tool.maturin]
features = ["python"]
module-name = "whitelist_tokenizer_rs"
